[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag-assistant"
version = "1.0.0"
description = "A hybrid RAG assistant with document and web search"
authors = [{name = "GZ30eee", email = "your.email@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "streamlit",
    "rank_bm25",
    "faiss-cpu",
    "sentence-transformers",
    "PyMuPDF",
    "python-docx",
    "beautifulsoup4",
    "readability-lxml",
    "requests",
    "httpx",
    "Pillow",
    "pytesseract",
    "google-generativeai",
    "qdrant-client",
    "langchain",
    "langgraph",
    "ragas",
]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
